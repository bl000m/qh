[project]
name = "qh-api"
version = "0.1.0"
description = "QH API backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.116.1",
  "pydantic==2.11.7",
  "uvicorn==0.35.0",
  "watchfiles==1.1.0",
  "alembic==1.16.4",
  "sqlalchemy==2.0.43",
  "psycopg[binary]==3.2.9",
  "httpx==0.28.1",
  "PyJWT[crypto]==2.10.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "neo4j==5.28.2",
  "ruff==0.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
