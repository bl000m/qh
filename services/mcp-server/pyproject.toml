[project]
name = "qh-mcp-server"
version = "0.1.0"
description = "Independent Python MCP adapter for QH"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mcp==1.12.4",
  "starlette==0.47.3",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "uvicorn==0.35.0",
  "watchfiles==1.1.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
