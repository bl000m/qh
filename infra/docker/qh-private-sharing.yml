# Explicit owner-authorized private Demo B activation, 2026-10-25.
# Selected only by guarded dev management with QH_PRIVATE_SHARING=1.
services:
  frontend:
    environment:
      VITE_QH_SHARING: '1'
      QH_WEB_TLS_KEY: /run/qh-tls/server.key
      QH_WEB_TLS_CERT: /run/qh-tls/server.crt
    volumes:
      - ../../.local-archive/qh40-private-runtime/tls:/run/qh-tls:ro
    networks:
      app:
        ipv4_address: ${QH_SHARING_FRONTEND_IP:?Exact current frontend address required}
    healthcheck:
      test: [CMD, node, -e, "require('https').get('https://127.0.0.1:5173/',{ca:require('fs').readFileSync('/run/qh-tls/ca.crt')},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
  backend:
    environment:
      QH_SHARING_ORIGIN: https://localhost:5173
      QH_GUEST_MISTRAL_ENABLED: ${QH_GUEST_MISTRAL_ENABLED:-false}
    volumes:
      - ../../.local-archive/qh40-private-runtime/guest:/run/qh-sharing:ro
    command: [uvicorn, 'app.bootstrap:create_sharing_runtime_app', --factory, --host, '0.0.0.0', --port, '8000', --reload, --reload-dir, app, --reload-dir, adapters, --no-access-log, --proxy-headers, --forwarded-allow-ips, '${QH_SHARING_FRONTEND_IP:?Exact current frontend address required}']
