name: qh

services:
  frontend:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile.dev
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ../../apps/web/src:/workspace/apps/web/src
      - ../../apps/web/index.html:/workspace/apps/web/index.html
      - ../../apps/web/vite.config.ts:/workspace/apps/web/vite.config.ts
      - ../../packages/shared/src:/workspace/packages/shared/src
    networks: [app]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  backend:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile.dev
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-qh}
      POSTGRES_USER: ${POSTGRES_USER:-qh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env (minimum 8 characters)}
      QH_NATIVE_CONTEXT_ENABLED: ${QH_NATIVE_CONTEXT_ENABLED:-false}
      QH_NATIVE_GRAPH_NAMESPACE: ${QH_NATIVE_GRAPH_NAMESPACE:-qh-native}
      WATCHFILES_FORCE_POLLING: "true"
      OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8080}/realms/qh
      OIDC_JWKS_URL: http://keycloak:8080/realms/qh/protocol/openid-connect/certs
      OIDC_AUDIENCE: qh-api
    depends_on:
      postgres: {condition: service_healthy}
      neo4j: {condition: service_healthy}
    volumes:
      - ../../apps/api/app:/workspace/apps/api/app
      - ../../apps/api/adapters:/workspace/apps/api/adapters
      - ../../apps/api/tests:/workspace/apps/api/tests
      - ../../tests:/workspace/tests
      - ../../scripts:/workspace/scripts
    networks: [app, data]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  mcp:
    build:
      context: ../..
      dockerfile: services/mcp-server/Dockerfile.dev
    ports:
      - "127.0.0.1:${MCP_PORT:-3001}:3001"
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ../../services/mcp-server/app:/workspace/services/mcp-server/app
      - ../../services/mcp-server/tests:/workspace/services/mcp-server/tests
    networks: [app]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  keycloak:
    profiles: [oidc]
    image: quay.io/keycloak/keycloak:26.4.7
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: qh-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
      QH_ALICE_PASSWORD: ${QH_ALICE_PASSWORD:-}
      QH_BOB_PASSWORD: ${QH_BOB_PASSWORD:-}
      FRONTEND_PORT: ${FRONTEND_PORT:-5173}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8080}
      KC_HEALTH_ENABLED: "true"
      KC_DB: dev-file
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ../keycloak/qh-realm.json:/opt/keycloak/data/import/qh-realm.json:ro
    networks: [app]
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q \"200\"'"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 60s

  postgres:
    image: postgres:16.8-alpine3.21
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qh}
      POSTGRES_USER: ${POSTGRES_USER:-qh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  neo4j:
    image: neo4j:5.26.5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env (minimum 8 characters)}
      # NEO4J_* variables are interpreted as Neo4j configuration settings.
      QH_NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env (minimum 8 characters)}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", 'cypher-shell -a bolt://localhost:7687 -u neo4j -p "$$QH_NEO4J_PASSWORD" "RETURN 1;" > /dev/null']
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

networks:
  app:
  data:
    internal: true

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  keycloak_data:
