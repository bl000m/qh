name: QH quality

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qh-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate workflow
        run: make lint-workflows
      - name: PR Fast — checks for changed components only
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import subprocess

          def run(*args):
              subprocess.run(args, check=True)

          files = subprocess.check_output(['git', 'diff', '--name-only', '-z',
              os.environ['BASE_SHA'], os.environ['HEAD_SHA']]).decode().split('\0')
          paths = [Path(p) for p in files if p]
          changed = [p for p in paths if p.is_file()]
          web = any(str(p).startswith(('apps/web/', 'packages/shared/')) or
              str(p) in ('package.json', 'package-lock.json', 'tsconfig.base.json') for p in paths)
          api = any(str(p).startswith('apps/api/') or str(p) == 'ruff.toml' for p in paths)

          if web:
              run('docker', 'build', '-f', 'apps/web/Dockerfile.browser', '-t', 'qh-fast-web', '.')
              run('docker', 'run', '--rm', '--network', 'none', 'qh-fast-web',
                  'npm', 'run', 'lint', '--workspace', 'apps/web')
              run('docker', 'run', '--rm', '--network', 'none', 'qh-fast-web',
                  'npm', 'run', 'build', '--workspace', 'apps/web')
              stems = {re.sub(r'(?<!^)(?=[A-Z])', '-', p.stem).lower() for p in paths
                  if str(p).startswith('apps/web/src/')}
              specs = sorted({str(p.relative_to('apps/web')) for p in Path('apps/web/tests').glob('*.spec.ts')
                  if not p.name.endswith('.browser.spec.ts') and (p in changed or any(
                      p.name == s+'.spec.ts' for s in stems))})
              if specs:
                  run('docker', 'run', '--rm', '--network', 'none', '--ipc=host', 'qh-fast-web',
                      'npm', 'run', 'test', '--workspace', 'apps/web', '--', *specs)

          if api:
              run('docker', 'build', '-f', 'apps/api/Dockerfile.dev', '-t', 'qh-fast-api', '.')
              run('docker', 'run', '--rm', '--network', 'none', 'qh-fast-api', 'ruff', 'check',
                  *([str(p.relative_to('apps/api')) for p in changed
                      if str(p).startswith('apps/api/') and p.suffix == '.py'] or ['app', 'adapters']))
              stems = {p.stem for p in paths if str(p).startswith('apps/api/') and p.suffix == '.py'}
              tests = sorted({str(p.relative_to('apps/api')) for p in Path('apps/api/tests').glob('test_*.py')
                  if p in changed or any(p.name == 'test_'+s+'.py' for s in stems)})
              if tests:
                  run('docker', 'run', '--rm', '--network', 'none', 'qh-fast-api',
                      'python', '-m', 'pytest', '-q', *tests)

          if not web and not api:
              print('No application components changed; workflow validation only.')
          PY

  quality:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Single-checkout legacy bootstrap regressions
        run: python3 -m unittest discover -s tests -p test_worktree_bootstrap.py -v
      - name: QH-33 v1/v2 lineage and review gates
        run: |
          python3 -m unittest discover -s tests -p 'test_qh33*.py' -v
          python3 scripts/audit_qh33_history.py
      - name: Generate runner-only credentials
        run: |
          python3 scripts/init_env.py
          python3 - <<'PY'
          from pathlib import Path
          from scripts.check_secrets import env_values, SECRET_NAME
          for key, value in env_values(Path('.env').read_text()).items():
              if SECRET_NAME.search(key) and value:
                  print('::add-mask::' + value)
          PY
      - name: Validate workflow
        run: make lint-workflows
      - name: Existing Docker quality gate
        run: make verify
      - name: Stop runner services without deleting volumes
        if: always()
        run: |
          if test -f .env; then
            docker compose --env-file .env -f infra/docker/docker-compose.yml stop
          fi

  oidc:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Generate runner-only credentials
        run: |
          python3 scripts/init_env.py
          python3 scripts/init_oidc_env.py
          python3 - <<'PY'
          from pathlib import Path
          from scripts.check_secrets import env_values, SECRET_NAME
          for key, value in env_values(Path('.env').read_text()).items():
              if SECRET_NAME.search(key) and value:
                  print('::add-mask::' + value)
          PY
      - name: Existing local OIDC setup on disposable hosted runner
        run: |
          make oidc-up
          # Preserve the existing live OIDC/runtime baseline. Draft schema 0007
          # is exercised separately in native-integration, without activation.
          docker compose --env-file .env -f infra/docker/docker-compose.yml exec -T backend alembic -c adapters/postgres/alembic.ini upgrade 0006_owner_organization
          make seed-oidc-demo
      - name: Existing deployed and isolated OIDC checks
        run: |
          make test-oidc-application
          make test-oidc
      - name: Stop runner services without deleting volumes
        if: always()
        run: docker compose --env-file .env -f infra/docker/docker-compose.yml --profile oidc stop

  native-integration:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Generate disposable integration credentials
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import secrets
          path = Path('/tmp/qh30-ci.env')
          values = {name: secrets.token_hex(24) for name in ('QH30_SQL_PASSWORD', 'QH30_GRAPH_PASSWORD')}
          fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(fd, 'w') as stream:
              for name, value in values.items():
                  print('::add-mask::' + value)
                  stream.write(f'{name}={value}\n')
          PY
      - name: Real PostgreSQL to Neo4j integration without skipped tests
        run: |
          docker compose --env-file /tmp/qh30-ci.env -p qh30-ci -f infra/docker/qh30-integration.yml build integration
          docker compose --env-file /tmp/qh30-ci.env -p qh30-ci -f infra/docker/qh30-integration.yml run --rm integration
      - name: Remove only disposable integration project
        if: always()
        run: |
          if test -f /tmp/qh30-ci.env; then
            docker compose --env-file /tmp/qh30-ci.env -p qh30-ci -f infra/docker/qh30-integration.yml down
            rm /tmp/qh30-ci.env
          fi

  browser:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Build existing backend and test-only Chromium image
        run: |
          docker build -f apps/api/Dockerfile.dev -t qh11-api:ci .
          docker build -f apps/web/Dockerfile.browser -t qh11-browser:ci .
          docker build -f apps/web/Dockerfile.dev -t qh12-web:ci .
      - name: Real browser PKCE and Alice/Bob REST acceptance
        run: |
          python3 scripts/test_qh11_browser.py --backend-image qh11-api:ci --browser-image qh11-browser:ci --frontend-image qh12-web:ci --understanding --qh-login-theme --chat-sessions --output /tmp/qh12-browser-evidence
      - name: QH-52/QH-53 normal product UI, rotating OIDC and isolated literal bootstrap
        run: |
          python3 scripts/test_qh11_browser.py --backend-image qh11-api:ci --browser-image qh11-browser:ci --frontend-image qh12-web:ci --understanding --qh-login-theme --chat-sessions --product-mode --browser-grep 'QH-52 product|QH-53 complete|QH-53 consent|QH-54 direct|QH-54 synthetic|QH-54 manual|QH-54 maquettes' --output /tmp/qh52-product-evidence

      - name: QH-51 UUM primary review and universal dimensions on a clean disposable dataset
        run: |
          python3 scripts/test_qh11_browser.py --backend-image qh11-api:ci --browser-image qh11-browser:ci --frontend-image qh12-web:ci --understanding --chat-sessions --product-mode --uum-mode --browser-grep 'QH-51 UUM' --output /tmp/qh51-semantic-evidence

      - name: Ordinary development AI and stable radial lifecycle, simulated provider only
        run: |
          python3 scripts/test_qh11_browser.py --backend-image qh11-api:ci --browser-image qh11-browser:ci --frontend-image qh12-web:ci --understanding --chat-sessions --product-mode --uum-mode --development-ai-mode --browser-grep 'QH-51 radial lifecycle|QH-51 ordinary AI' --output /tmp/qh51-ordinary-ai-evidence

      - name: Demo B — HTTPS owner sharing and real isolated SMTP verification, offline ASK only
        run: |
          python3 scripts/test_qh11_browser.py --backend-image qh11-api:ci --browser-image qh11-browser:ci --frontend-image qh12-web:ci --understanding --chat-sessions --product-mode --uum-mode --sharing-mode --browser-grep 'Demo B:' --output /tmp/qh40-sharing-evidence
